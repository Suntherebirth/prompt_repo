<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프롬프트 저장소</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1a1a24;
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a3a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.3rem; color: #c084fc; font-weight: 700; }

    .main {
      display: flex;
      flex: 1;
      gap: 0;
      overflow: hidden;
      height: calc(100vh - 57px);
      min-height: 0;
    }

    /* ── Left Panel: Prompt Library ── */
    .panel-library {
      width: 420px;
      min-width: 300px;
      height: 100%;
      background: #13131c;
      border-right: 1px solid #2a2a3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px 10px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      border-bottom: 1px solid #1e1e2e;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid #1e1e2e;
    }

    .filter-section {
      padding: 8px 12px;
      border-bottom: 1px solid #1e1e2e;
    }

    .filter-title {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 6px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    #main-filter {
      width: 100%;
      display: block;
    }

    .subcategory-filter-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .subcategory-filter-group {
      border: 1px solid #232336;
      border-radius: 10px;
      overflow: hidden;
      background: #151522;
    }

    .subcategory-filter-group summary {
      list-style: none;
      cursor: pointer;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #e7defa;
      font-size: 0.82rem;
      font-weight: 700;
      background: #191927;
    }

    .subcategory-filter-group summary::-webkit-details-marker { display: none; }

    .subcategory-filter-group .group-count {
      font-size: 0.72rem;
      color: #8f8fa6;
      font-weight: 500;
      white-space: nowrap;
    }

    .subcategory-filter-body {
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .subcategory-filter-empty {
      padding: 0 12px 12px;
      color: #6e6e84;
      font-size: 0.76rem;
    }

    .main-category-filter-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
    }

    .main-category-filter-group {
      border: none;
      border-top: 1px solid #232336;
      border-radius: 0;
      overflow: visible;
      background: transparent;
      width: 100%;
    }

    .main-category-filter-group summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 4px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #e7defa;
      font-size: 0.82rem;
      font-weight: 700;
      background: transparent;
    }

    .main-category-filter-group summary::-webkit-details-marker { display: none; }

    .main-category-filter-group .group-count {
      font-size: 0.72rem;
      color: #8f8fa6;
      font-weight: 500;
      white-space: nowrap;
    }

    .main-category-filter-body {
      padding: 0 0 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .main-category-filter-active summary {
      color: #f1e8ff;
    }

    .main-category-filter-group:first-child {
      border-top: none;
    }
    .cat-chip {
      padding: 3px 10px;
      border-radius: 999px;
      background: #1e1e2e;
      color: #aaa;
      font-size: 0.78rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .15s;
      user-select: none;
    }
    .cat-chip:hover { border-color: #c084fc; color: #c084fc; }
    .cat-chip.active { background: #c084fc22; border-color: #c084fc; color: #c084fc; }

    .cat-chip.used {
      border-color: #4f7cff88;
      color: #9fb8ff;
      background: #203053;
    }

    .cat-chip.used.active {
      border-color: #8ab4ff;
      color: #d6e2ff;
      background: #2a3e66;
    }

    .cat-chip-mark {
      margin-right: 4px;
      font-weight: 700;
      color: inherit;
    }

    .prompt-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .prompt-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #1a1a26;
      margin-bottom: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .15s;
    }
    .prompt-item:hover { border-color: #c084fc55; background: #1e1e30; }
    .prompt-item.selected { border-color: #c084fc; background: #c084fc18; }
    .prompt-item .cat-badge {
      font-size: 0.68rem;
      background: #c084fc22;
      color: #c084fc;
      border-radius: 4px;
      padding: 2px 6px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .prompt-item .cat-badge.sub {
      background: #22304a;
      color: #8ab4ff;
    }
    .prompt-item .content { font-size: 0.85rem; color: #ddd; flex: 1; word-break: break-all; }
    .prompt-item .del-btn {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }
    .prompt-item .del-btn:hover { color: #f87171; }

    /* ── Center Panel: Add Prompt ── */
    .panel-add {
      width: 260px;
      min-width: 200px;
      height: 100%;
      background: #15151f;
      border-right: 1px solid #2a2a3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-add.collapsed {
      width: 56px;
      min-width: 56px;
    }

    .panel-add .panel-header { justify-content: flex-start; }

    .panel-add .panel-header .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-add.collapsed .panel-header {
      justify-content: center;
      padding: 14px 8px 10px;
    }

    .panel-add.collapsed .panel-header .title {
      display: none;
    }

    .panel-toggle-btn {
      margin-left: auto;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid #2a2a3a;
      background: #1e1e2e;
      color: #c084fc;
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
    }

    .panel-toggle-btn:hover {
      background: #2a2a3e;
    }

    .panel-add.collapsed .panel-toggle-btn {
      margin-left: 0;
    }

    .panel-add-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .panel-mode-toggle {
      display: flex;
      gap: 8px;
      padding: 12px 14px 0;
    }

    .mode-toggle-btn {
      flex: 1;
      border: 1px solid #2a2a3a;
      background: #1a1a28;
      color: #a9a9bc;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.76rem;
      cursor: pointer;
      transition: all .15s;
      font-weight: 600;
    }

    .mode-toggle-btn:hover {
      border-color: #c084fc66;
      color: #ddd;
    }

    .mode-toggle-btn.active {
      background: #c084fc22;
      border-color: #c084fc;
      color: #e7d2ff;
    }

    .panel-mode-view {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-mode-view.active {
      display: flex;
    }

    .panel-filter-view {
      padding: 12px;
      overflow-y: auto;
    }

    .panel-filter-view .filter-section {
      padding: 0;
      border-bottom: none;
    }

    .library-footer {
      padding: 10px 12px 12px;
      border-top: 1px solid #1e1e2e;
      background: #13131c;
    }

    .library-footer .btn {
      width: 100%;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 16, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      padding: 18px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: min(560px, 100%);
      max-height: 92vh;
      background: #15151f;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid #242437;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title {
      font-size: 0.9rem;
      color: #ddd;
      font-weight: 700;
    }

    .modal-close {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid #2a2a3a;
      background: #1e1e2e;
      color: #aaa;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: #eee;
      border-color: #c084fc66;
    }

    .modal-body {
      overflow-y: auto;
    }

    .panel-add.collapsed .panel-add-body {
      display: none;
    }

    .add-form {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .category-input-wrap {
      position: relative;
    }

    .category-suggest {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #1a1a28;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 6px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 20;
      display: none;
    }

    .category-suggest.open {
      display: block;
    }

    .category-option {
      width: 100%;
      text-align: left;
      background: transparent;
      color: #ddd;
      border: none;
      border-radius: 6px;
      padding: 7px 8px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .category-option:hover,
    .category-option:focus {
      background: #c084fc22;
      color: #f0ddff;
      outline: none;
    }

    .category-option-create {
      color: #c084fc;
      border-top: 1px solid #2a2a3a;
      margin-top: 4px;
      padding-top: 9px;
    }

    .category-empty {
      font-size: 0.78rem;
      color: #777;
      padding: 8px;
    }

    label { font-size: 0.78rem; color: #888; margin-bottom: 2px; display: block; }

    input[type="text"], textarea, select {
      width: 100%;
      background: #1a1a28;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    input[type="text"]:focus, textarea:focus, select:focus { border-color: #c084fc; }
    textarea { resize: vertical; min-height: 80px; }

    .btn {
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
      font-weight: 600;
    }
    .btn-primary { background: #c084fc; color: #0f0f13; }
    .btn-primary:hover { background: #d8a0ff; }
    .btn-secondary { background: #1e1e2e; color: #ccc; border: 1px solid #2a2a3a; }
    .btn-secondary:hover { background: #2a2a3e; }
    .btn-danger { background: #f87171; color: #0f0f13; }
    .btn-danger:hover { background: #fca5a5; }
    .btn-sm { padding: 5px 10px; font-size: 0.78rem; }

    .csv-section {
      padding: 14px;
      border-top: 1px solid #1e1e2e;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .csv-section .section-label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.06em; }

    .combo-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 14px;
      gap: 10px;
    }

    .combo-save-body {
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      background: #141420;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      flex: 1;
    }

    .combo-filter-wrap {
      margin-top: 2px;
    }

    /* ── Right Panel: Composer ── */
    .panel-composer {
      flex: 1;
      height: 100%;
      background: #11111a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .selected-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 12px 16px;
      min-height: 60px;
      border-bottom: 1px solid #1e1e2e;
      align-content: flex-start;
    }

    .selected-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #c084fc22;
      border: 1px solid #c084fc55;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.82rem;
      color: #e0d0ff;
      cursor: default;
    }
    .selected-chip .chip-cat { font-size: 0.7rem; color: #c084fc; font-weight: 600; }
    .selected-chip .chip-remove {
      background: none; border: none; color: #c084fc99; cursor: pointer;
      font-size: 0.9rem; padding: 0; line-height: 1;
    }
    .selected-chip .chip-remove:hover { color: #f87171; }

    .composer-output {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .output-box {
      background: #1a1a26;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.88rem;
      color: #e0e0e0;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 80px;
      flex: 1;
      cursor: text;
    }

    .output-editor {
      display: none;
      width: 100%;
      min-height: 140px;
      background: #1a1a26;
      border: 1px solid #c084fc;
      border-radius: 10px;
      color: #e0e0e0;
      padding: 14px;
      font-size: 0.88rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    .output-edit-actions {
      display: none;
      gap: 8px;
      justify-content: flex-end;
    }

    .composer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
    }

    .composer-actions .btn-danger {
      margin-left: auto;
    }

    .combo-save-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: nowrap;
      margin-left: 12px;
    }

    .combo-save-row select {
      width: 170px;
      max-width: 100%;
      flex: 0 0 auto;
    }

    .combo-load-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .combo-load-item {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      border: 1px solid #2a2a3a;
      border-radius: 7px;
      background: #171724;
      padding: 7px;
    }

    .combo-load-item .meta {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .combo-load-item .meta .cat {
      font-size: 0.7rem;
      color: #8ab4ff;
      font-weight: 700;
    }

    .combo-load-item .meta .text {
      font-size: 0.78rem;
      color: #c9c9d9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .combo-load-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
    }

    .combo-load-actions .btn {
      width: 100%;
    }

    .combo-load-empty {
      font-size: 0.78rem;
      color: #777;
      padding: 6px 2px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #c084fc;
      color: #0f0f13;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: all .3s;
      z-index: 9999;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .empty-state {
      text-align: center;
      color: #444;
      font-size: 0.85rem;
      padding: 32px 16px;
    }

    .drag-over { border-color: #c084fc !important; background: #c084fc11 !important; }

    .list-section-title {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #666;
      margin: 12px 4px 8px;
    }

    .list-subsection-title {
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8a8a9a;
      margin: 8px 4px 6px 16px;
    }

  </style>
</head>
<body>

<header>
  <span style="font-size:1.4rem">✨</span>
  <h1>프롬프트 저장소</h1>
  <span style="margin-left:auto;font-size:0.78rem;color:#555">이미지 생성 프롬프트 관리</span>
</header>

<div class="main">

  <!-- Left: Add + CSV -->
  <div class="panel-add" id="panel-add">
    <div class="panel-header">
      <span class="title">필터 / 커스텀 조합</span>
      <button class="panel-toggle-btn" id="toggle-add-panel" onclick="toggleAddPanel()" title="접기" aria-label="필터 및 커스텀 조합 패널 접기">◀</button>
    </div>
    <div class="panel-add-body" id="panel-add-body">
      <div class="panel-mode-toggle">
        <button class="mode-toggle-btn active" id="mode-btn-filter" type="button" onclick="setPanelMode('filter')">중분류 선택</button>
        <button class="mode-toggle-btn" id="mode-btn-combo" type="button" onclick="setPanelMode('combo')">커스텀 조합</button>
      </div>

      <div class="panel-mode-view" id="panel-view-combo">
        <div class="combo-section">
          <div class="combo-save-body">
            <div class="combo-filter-wrap">
              <div class="filter-row" id="combo-filter"></div>
            </div>
            <div class="combo-load-list" id="combo-load-list"></div>
          </div>

          <div class="csv-section" style="margin-top:0">
            <div class="section-label">CSV 가져오기 / 내보내기</div>
            <button class="btn btn-secondary btn-sm" onclick="exportCSV()">📤 CSV 내보내기</button>
            <label class="btn btn-secondary btn-sm" style="text-align:center;cursor:pointer">
              📥 CSV 가져오기
              <input type="file" accept=".csv" id="csv-import-combo" style="display:none" onchange="importCSV(event)" />
            </label>
          </div>
        </div>
      </div>

      <div class="panel-mode-view panel-filter-view" id="panel-view-filter">
        <div class="filter-section">
          <div class="filter-row" id="main-filter"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Center: Library -->
  <div class="panel-library">
    <div class="panel-header">
      <span>저장된 프롬프트</span>
      <span id="count-badge" style="font-size:0.8rem;color:#c084fc;font-weight:700"></span>
    </div>
    <div class="prompt-list" id="prompt-list"></div>
    <div class="library-footer">
      <button class="btn btn-primary" type="button" onclick="openAddPromptModal()">+ 새 프롬프트 추가</button>
    </div>
  </div>

  <!-- Right: Composer -->
  <div class="panel-composer">
    <div class="panel-header" style="padding:14px 16px 10px;font-size:0.78rem;text-transform:uppercase;letter-spacing:.08em;color:#888;border-bottom:1px solid #1e1e2e;display:flex;align-items:center;gap:8px">
      <span>조합된 프롬프트</span>
    </div>
    <div class="selected-chips" id="selected-chips">
      <span class="empty-state" id="chips-empty">선택된 프롬프트가 없습니다</span>
    </div>
    <div class="composer-output">
      <div class="output-box" id="output-box" onclick="startOutputEdit()" title="터치해서 편집">프롬프트를 선택하면 여기에 표시됩니다.</div>
      <textarea class="output-editor" id="output-editor"></textarea>
      <div class="output-edit-actions" id="output-edit-actions">
        <button class="btn btn-secondary btn-sm" onclick="cancelOutputEdit()">취소</button>
        <button class="btn btn-primary btn-sm" onclick="applyOutputEdit()">적용</button>
      </div>
      <div class="composer-actions">
        <button class="btn btn-primary" onclick="copyPrompt()">📋 클립보드 복사</button>
        <button class="btn btn-danger btn-sm" onclick="clearCurrentComposition()">🧹 조합 초기화</button>
        <div class="combo-save-row">
          <select id="combo-main-category"></select>
          <select id="combo-sub-category" disabled></select>
          <button class="btn btn-secondary btn-sm" onclick="saveComposedPrompt()">💾 조합 저장</button>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="modal-backdrop" id="add-prompt-modal" onclick="handleAddPromptModalBackdrop(event)">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="add-prompt-modal-title">
    <div class="modal-header">
      <span class="modal-title" id="add-prompt-modal-title">새 프롬프트 추가</span>
      <button class="modal-close" type="button" onclick="closeAddPromptModal()" aria-label="모달 닫기">×</button>
    </div>
    <div class="modal-body">
      <div class="add-form" style="max-height:none">
        <div>
          <label>대분류</label>
          <div class="category-input-wrap">
            <select id="input-main-category"></select>
          </div>
        </div>
        <div>
          <label>중분류</label>
          <div class="category-input-wrap">
            <select id="input-sub-category" disabled></select>
          </div>
        </div>
        <div>
          <label>내용</label>
          <textarea id="input-content" placeholder="내용을 입력"></textarea>
        </div>
        <button class="btn btn-primary" onclick="addPrompt()">+ 저장</button>
      </div>

      <div class="csv-section" style="margin-top:0">
        <div class="section-label">CSV 가져오기 / 내보내기</div>
        <button class="btn btn-secondary btn-sm" onclick="exportCSV()">📤 CSV 내보내기</button>
        <label class="btn btn-secondary btn-sm" style="text-align:center;cursor:pointer">
          📥 CSV 가져오기
          <input type="file" accept=".csv" id="csv-import" style="display:none" onchange="importCSV(event)" />
        </label>
      </div>
    </div>
  </div>
</div>

<div id="toast">복사되었습니다!</div>

<script>
  const STORAGE_KEY = 'prompt_repo_v1';
  const COMPOSED_STORAGE_KEY = 'prompt_repo_composed_v1';
  const ADD_PANEL_COLLAPSE_KEY = 'prompt_repo_add_panel_collapsed_v1';
  const ADD_PANEL_MODE_KEY = 'prompt_repo_add_panel_mode_v1';

  // ── State ──
  let prompts = [];          // [{id, mainCategory, subCategory, content}] 개별 프롬프트
  let composedPrompts = [];  // [{id, mainCategory, subCategory, items, content}] 조합 저장 프롬프트
  let selected = [];         // [{id, mainCategory, subCategory, content, source}]
  let activeCategoryPrompt = null;
  let activeSubCategoryPrompt = null;
  let activeCategoryComposed = null;
  let isAddPanelCollapsed = false;
  let addPanelMode = 'filter';
  let isOutputEditing = false;
  let customOutputText = null;
  let isAddPromptModalOpen = false;
  let lastAddMainCategory = '';
  let lastAddSubCategory = '';

  const OUTPUT_PLACEHOLDER = '프롬프트를 선택하면 여기에 표시됩니다.';

  // ── Persistence ──
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const loaded = raw ? JSON.parse(raw) : [];
      prompts = loaded.map(normalizePrompt).filter(Boolean);
    } catch { prompts = []; }

    try {
      const rawComposed = localStorage.getItem(COMPOSED_STORAGE_KEY);
      const loadedComposed = rawComposed ? JSON.parse(rawComposed) : [];
      composedPrompts = loadedComposed.map(normalizeComposedPrompt).filter(Boolean);
    } catch { composedPrompts = []; }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(prompts));
    localStorage.setItem(COMPOSED_STORAGE_KEY, JSON.stringify(composedPrompts));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function normalizePrompt(prompt) {
    if (!prompt) return null;
    const mainCategory = (prompt.mainCategory ?? '').trim();
    const subCategory = (prompt.subCategory ?? prompt.category ?? '').trim();
    const content = (prompt.content ?? '').trim();
    if (!content) return null;
    return {
      id: prompt.id || uid(),
      mainCategory: mainCategory || '기타',
      subCategory: subCategory || '기타',
      content,
    };
  }

  function cleanPrompt(prompt) {
    return {
      id: prompt.id,
      mainCategory: prompt.mainCategory,
      subCategory: prompt.subCategory,
      content: prompt.content,
    };
  }

  function normalizeSelected(item) {
    if (!item) return null;
    return {
      ...item,
      mainCategory: (item.mainCategory ?? item.category ?? '기타').trim() || '기타',
      subCategory: (item.subCategory ?? item.category ?? '기타').trim() || '기타',
      content: (item.content ?? '').trim(),
    };
  }

  function normalizeComposedPrompt(item) {
    if (!item) return null;
    const mainCategory = (item.mainCategory ?? item.category ?? '').trim() || '커스텀 조합';
    const subCategory = (item.subCategory ?? item.name ?? '').trim() || '이름없음';
    let items = Array.isArray(item.items)
      ? item.items.map(normalizePrompt).filter(Boolean)
      : [];

    // 이전 포맷({category, content}) 호환: 단일 문자열을 1개 프롬프트 아이템으로 변환
    if (items.length === 0 && typeof item.content === 'string' && item.content.trim()) {
      items = [{
        id: uid(),
        mainCategory,
        subCategory,
        content: item.content.trim(),
      }];
    }

    if (items.length === 0) return null;

    return {
      id: item.id || uid(),
      mainCategory,
      subCategory,
      category: mainCategory,
      items,
      content: items.map(p => p.content).join(', '),
    };
  }

  function getComposedItemText(item) {
    if (!item) return '';
    if (Array.isArray(item.items) && item.items.length > 0) {
      return item.items.map(p => p.content).join(', ');
    }
    return (item.content ?? '').trim();
  }

  // ── Categories ──
  function getCategories() {
    return [...new Set([...prompts, ...composedPrompts].map(p => p.category).filter(Boolean))].sort();
  }

  function getMainCategories() {
    return [...new Set(prompts.map(p => p.mainCategory).filter(Boolean))].sort();
  }

  function getSubCategories(mainCategory) {
    const filtered = mainCategory ? prompts.filter(p => p.mainCategory === mainCategory) : prompts;
    return [...new Set(filtered.map(p => p.subCategory).filter(Boolean))].sort();
  }

  function getComposedCategories() {
    return [...new Set(composedPrompts.map(p => p.mainCategory).filter(Boolean))].sort();
  }

  function getComposedSubCategories(mainCategory) {
    const filtered = mainCategory ? composedPrompts.filter(p => p.mainCategory === mainCategory) : composedPrompts;
    return [...new Set(filtered.map(p => p.subCategory).filter(Boolean))].sort();
  }

  // ── Render ──
  function render() {
    renderMainCategoryFilter();
    renderComposedFilter();
    renderComposedLoadList();
    renderCategorySelectors();
    renderComposedCategorySelectors();
    syncAddFormSelection();
    renderPromptList();
    renderSelected();
    document.getElementById('count-badge').textContent = prompts.length ? `(${prompts.length})` : '';
  }

  function renderCategorySelectors() {
    renderMainCategorySelect();
    renderSubCategorySelect();
  }

  function renderComposedCategorySelectors() {
    renderComposedMainCategorySelect();
    renderComposedSubCategorySelect();
  }

  function syncAddFormSelection() {
    const mainSelect = document.getElementById('input-main-category');
    const subSelect = document.getElementById('input-sub-category');

    if (activeCategoryPrompt) {
      mainSelect.value = activeCategoryPrompt;
    }

    renderSubCategorySelect();

    if (activeCategoryPrompt && activeSubCategoryPrompt) {
      subSelect.value = activeSubCategoryPrompt;
    } else if (activeCategoryPrompt) {
      subSelect.value = '';
    }
  }

  function renderMainCategoryFilter() {
    const el = document.getElementById('main-filter');
    el.innerHTML = '';
    const mainCategories = getMainCategories();
    if (mainCategories.length === 0) {
      el.innerHTML = '<div class="subcategory-filter-empty">아직 대분류가 없습니다. 새 프롬프트를 추가하세요.</div>';
      return;
    }

    const list = document.createElement('div');
    list.className = 'main-category-filter-list';

    mainCategories.forEach(mainCategory => {
      const subCategories = getSubCategories(mainCategory);
      const group = document.createElement('details');
      group.className = 'main-category-filter-group';
      group.open = true;

      if (activeCategoryPrompt === mainCategory) {
        group.classList.add('main-category-filter-active');
      }

      const summary = document.createElement('summary');
      summary.innerHTML = `<span>${esc(mainCategory)}</span><span class="group-count">${subCategories.length}개</span>`;
      group.appendChild(summary);

      const body = document.createElement('div');
      body.className = 'main-category-filter-body';

      if (subCategories.length === 0) {
        const empty = document.createElement('span');
        empty.className = 'subcategory-filter-empty';
        empty.style.padding = '0';
        empty.textContent = '중분류 없음';
        body.appendChild(empty);
      } else {
        subCategories.forEach(subCategory => {
          const used = isSubCategoryUsed(mainCategory, subCategory);
          const chip = document.createElement('span');
          chip.className = 'cat-chip' + (used ? ' used' : '') + (activeCategoryPrompt === mainCategory && activeSubCategoryPrompt === subCategory ? ' active' : '');
          chip.innerHTML = `${used ? '<span class="cat-chip-mark">✓</span>' : ''}${esc(subCategory)}`;
          chip.onclick = () => {
            activeCategoryPrompt = mainCategory;
            activeSubCategoryPrompt = subCategory;
            render();
          };
          body.appendChild(chip);
        });
      }

      group.appendChild(body);
      list.appendChild(group);
    });

    el.appendChild(list);
  }

  function renderComposedFilter() {
    const cats = getComposedCategories();
    const el = document.getElementById('combo-filter');
    el.innerHTML = '';

    const all = document.createElement('span');
    all.className = 'cat-chip' + (activeCategoryComposed === null ? ' active' : '');
    all.textContent = '전체';
    all.onclick = () => { activeCategoryComposed = null; render(); };
    el.appendChild(all);

    if (cats.length === 0) return;

    cats.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'cat-chip' + (activeCategoryComposed === c ? ' active' : '');
      chip.textContent = c;
      chip.onclick = () => { activeCategoryComposed = (activeCategoryComposed === c) ? null : c; render(); };
      el.appendChild(chip);
    });
  }

  function renderComposedLoadList() {
    const list = document.getElementById('combo-load-list');
    const filteredComposed = activeCategoryComposed
      ? composedPrompts.filter(p => p.mainCategory === activeCategoryComposed)
      : composedPrompts;

    list.innerHTML = '';

    if (filteredComposed.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'combo-load-empty';
      empty.textContent = '불러올 커스텀 조합이 없습니다.';
      list.appendChild(empty);
      return;
    }

    filteredComposed.forEach(p => {
      const composedText = getComposedItemText(p);
      const item = document.createElement('div');
      item.className = 'combo-load-item';
      item.innerHTML = `
        <div class="meta">
          <span class="cat">${esc(p.subCategory)}</span>
          <span class="text" title="${esc(composedText)}">${esc(composedText)}</span>
        </div>
      `;

      const actions = document.createElement('div');
      actions.className = 'combo-load-actions';

      const loadBtn = document.createElement('button');
      loadBtn.className = 'btn btn-secondary btn-sm';
      loadBtn.type = 'button';
      loadBtn.textContent = '불러오기';
      loadBtn.onclick = () => loadComposedPrompt(p.id);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn btn-danger btn-sm';
      deleteBtn.type = 'button';
      deleteBtn.textContent = '삭제';
      deleteBtn.onclick = () => deleteComposedPrompt(p.id);

      actions.appendChild(loadBtn);
      actions.appendChild(deleteBtn);
      item.appendChild(actions);
      list.appendChild(item);
    });
  }

  function loadComposedPrompt(id) {
    const item = composedPrompts.find(p => p.id === id);
    if (!item) {
      showToast('불러올 조합을 찾지 못했습니다');
      return;
    }
    clearOutputOverride();
    selected = item.items.map(entry => ({ ...normalizeSelected(entry), source: 'prompt' })).filter(entry => entry && entry.content);
    render();
    const text = getComposedOutputText();
    copyPromptSilently(text)
      .then(() => showToast('커스텀 조합을 불러오고 클립보드에 복사했습니다'))
      .catch(() => showToast('커스텀 조합은 불러왔지만 복사에 실패했습니다'));
  }

  function deleteComposedPrompt(id) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    clearOutputOverride();
    composedPrompts = composedPrompts.filter(p => p.id !== id);
    selected = selected.filter(s => !(s.id === id && s.source === 'composed'));
    save();
    render();
    showToast('커스텀 조합이 삭제되었습니다');
  }

  function renderPromptList() {
    const list = document.getElementById('prompt-list');

    if (!activeCategoryPrompt) {
      list.innerHTML = '<div class="empty-state">왼쪽 패널의 중분류 선택 탭에서 필터를 선택하세요.</div>';
      return;
    }

    const filteredPrompts = prompts.filter(p => {
      if (activeCategoryPrompt && p.mainCategory !== activeCategoryPrompt) return false;
      if (activeSubCategoryPrompt && p.subCategory !== activeSubCategoryPrompt) return false;
      return true;
    });

    if (filteredPrompts.length === 0) {
      list.innerHTML = '<div class="empty-state">선택한 조건의 프롬프트가 없습니다.<br/>중분류 선택 탭에서 다른 조건을 선택하세요.</div>';
      return;
    }

    list.innerHTML = '';

    filteredPrompts.forEach(p => {
      const isSelected = selected.some(s => s.id === p.id && s.source === 'prompt');
      const item = document.createElement('div');
      item.className = 'prompt-item' + (isSelected ? ' selected' : '');
      item.innerHTML = `
        <span class="cat-badge">${esc(p.mainCategory)}</span>
        <span class="cat-badge sub">${esc(p.subCategory)}</span>
        <span class="content">${esc(p.content)}</span>
        <button class="del-btn" title="삭제" onclick="deletePrompt('${p.id}','prompt',event)">×</button>
      `;
      item.onclick = (e) => {
        if (e.target.classList.contains('del-btn')) return;
        toggleSelect(p, 'prompt');
      };
      list.appendChild(item);
    });
  }

  function isSubCategoryUsed(mainCategory, subCategory) {
    return selected.some(item => {
      if (item.source === 'prompt') {
        return item.mainCategory === mainCategory && item.subCategory === subCategory;
      }
      return false;
    });
  }

  function renderSelected() {
    const container = document.getElementById('selected-chips');
    const empty = document.getElementById('chips-empty');
    container.innerHTML = '';

    if (selected.length === 0) {
      const e = document.createElement('span');
      e.id = 'chips-empty';
      e.className = 'empty-state';
      e.textContent = '선택된 프롬프트가 없습니다';
      container.appendChild(e);
    } else {
      selected.forEach((p, i) => {
        const chip = document.createElement('div');
        chip.className = 'selected-chip';
        chip.draggable = true;
        chip.dataset.idx = i;
        chip.innerHTML = `
          <span class="chip-cat">${esc(p.mainCategory || p.category)}</span>
          <span class="chip-cat" style="color:#8ab4ff">${esc(p.subCategory || '')}</span>
          <span>${esc(p.content)}</span>
          <button class="chip-remove" title="제거" onclick="removeSelected(${i})">×</button>
        `;
        chip.addEventListener('dragstart', dragStart);
        chip.addEventListener('dragover', dragOver);
        chip.addEventListener('drop', drop);
        container.appendChild(chip);
      });
    }

    updateOutput();
  }

  function getComposedOutputText() {
    if (customOutputText !== null) return customOutputText;
    if (selected.length === 0) return '';
    const sep = ', ';
    return selected.map(p => p.content).join(sep);
  }

  function setOutputEditMode(editing) {
    const box = document.getElementById('output-box');
    const editor = document.getElementById('output-editor');
    const actions = document.getElementById('output-edit-actions');
    isOutputEditing = editing;
    box.style.display = editing ? 'none' : 'block';
    editor.style.display = editing ? 'block' : 'none';
    actions.style.display = editing ? 'flex' : 'none';
  }

  function startOutputEdit() {
    const text = getComposedOutputText();
    if (!text) {
      showToast('편집할 조합 프롬프트가 없습니다');
      return;
    }
    const editor = document.getElementById('output-editor');
    editor.value = text;
    setOutputEditMode(true);
    editor.focus();
  }

  function applyOutputEdit() {
    const editor = document.getElementById('output-editor');
    const text = editor.value;
    if (!text.trim()) {
      showToast('빈 내용으로는 적용할 수 없습니다');
      return;
    }
    customOutputText = text;
    setOutputEditMode(false);
    updateOutput();
    showToast('조합 프롬프트가 수정되었습니다');
  }

  function cancelOutputEdit() {
    setOutputEditMode(false);
    updateOutput();
  }

  function clearOutputOverride() {
    customOutputText = null;
    if (isOutputEditing) setOutputEditMode(false);
  }

  function updateOutput() {
    if (isOutputEditing) return;
    const box = document.getElementById('output-box');
    const text = getComposedOutputText();
    box.textContent = text || OUTPUT_PLACEHOLDER;
  }

  function renderCategorySuggestions() {
    renderCategorySelectors();
  }

  function appendSelectOption(select, value, label) {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = label;
    select.appendChild(option);
  }

  function renderMainCategorySelect() {
    const select = document.getElementById('input-main-category');
    const categories = getMainCategories();
    const current = select.value;

    select.innerHTML = '';
    appendSelectOption(select, '', '대분류 선택');
    appendSelectOption(select, '__new__', '＋ 새 대분류 추가');
    categories.forEach(category => appendSelectOption(select, category, category));

    if (current && [...categories, '__new__'].includes(current)) {
      select.value = current;
    }
  }

  function renderSubCategorySelect() {
    const mainSelect = document.getElementById('input-main-category');
    const select = document.getElementById('input-sub-category');
    const mainCategory = mainSelect.value && mainSelect.value !== '__new__' ? mainSelect.value : '';
    const categories = mainCategory ? getSubCategories(mainCategory) : [];
    const current = select.value;

    select.innerHTML = '';
    appendSelectOption(select, '', mainCategory ? '중분류 선택' : '대분류를 먼저 선택');

    if (mainCategory) {
      categories.forEach(category => appendSelectOption(select, category, category));
      appendSelectOption(select, '__new__', '＋ 새 중분류 추가');
      if (categories.length === 0) {
        appendSelectOption(select, '기타', '기타');
      }
      select.disabled = false;
      if (current && [...categories, '기타'].includes(current)) {
        select.value = current;
      }
    } else {
      select.disabled = true;
    }
  }

  function renderComposedMainCategorySelect() {
    const select = document.getElementById('combo-main-category');
    const categories = getComposedCategories();
    const current = select.value;

    select.innerHTML = '';
    appendSelectOption(select, '', '커스텀 대분류 선택');
    categories.forEach(category => appendSelectOption(select, category, category));
    appendSelectOption(select, '__new__', '＋ 새 대분류 추가');

    if (current && categories.includes(current)) {
      select.value = current;
    }
  }

  function renderComposedSubCategorySelect() {
    const mainSelect = document.getElementById('combo-main-category');
    const select = document.getElementById('combo-sub-category');
    const mainCategory = mainSelect.value && mainSelect.value !== '__new__' ? mainSelect.value : '';
    const categories = mainCategory ? getComposedSubCategories(mainCategory) : [];
    const current = select.value;

    select.innerHTML = '';
    appendSelectOption(select, '', mainCategory ? '커스텀 이름(중분류) 선택' : '대분류를 먼저 선택');

    if (mainCategory) {
      categories.forEach(category => appendSelectOption(select, category, category));
      appendSelectOption(select, '__new__', '＋ 새 이름 추가');
      select.disabled = false;
      if (current && categories.includes(current)) {
        select.value = current;
      }
    } else {
      select.disabled = true;
    }
  }

  function handleMainCategoryChange() {
    const select = document.getElementById('input-main-category');
    if (select.value === '__new__') {
      const nextValue = prompt('새 대분류 이름을 입력하세요');
      if (nextValue && nextValue.trim()) {
        const value = nextValue.trim();
        appendSelectOption(select, value, value);
        select.value = value;
      } else {
        select.value = '';
      }
    }
    renderSubCategorySelect();
  }

  function handleSubCategoryChange() {
    const select = document.getElementById('input-sub-category');
    if (select.value === '__new__') {
      const nextValue = prompt('새 중분류 이름을 입력하세요');
      if (nextValue && nextValue.trim()) {
        const value = nextValue.trim();
        appendSelectOption(select, value, value);
        select.value = value;
      } else {
        select.value = '';
      }
    }
  }

  function handleComposedMainCategoryChange() {
    const select = document.getElementById('combo-main-category');
    if (select.value === '__new__') {
      const nextValue = prompt('새 커스텀 대분류 이름을 입력하세요');
      if (nextValue && nextValue.trim()) {
        const value = nextValue.trim();
        appendSelectOption(select, value, value);
        select.value = value;
      } else {
        select.value = '';
      }
    }
    renderComposedSubCategorySelect();
  }

  function handleComposedSubCategoryChange() {
    const select = document.getElementById('combo-sub-category');
    if (select.value === '__new__') {
      const nextValue = prompt('새 커스텀 이름(중분류)을 입력하세요');
      if (nextValue && nextValue.trim()) {
        const value = nextValue.trim();
        appendSelectOption(select, value, value);
        select.value = value;
      } else {
        select.value = '';
      }
    }
  }

  function setAddPanelCollapsed(collapsed) {
    const panel = document.getElementById('panel-add');
    const toggleBtn = document.getElementById('toggle-add-panel');
    isAddPanelCollapsed = collapsed;
    panel.classList.toggle('collapsed', collapsed);
    toggleBtn.textContent = collapsed ? '▶' : '◀';
    toggleBtn.title = collapsed ? '펼치기' : '접기';
    toggleBtn.setAttribute('aria-label', collapsed ? '필터 및 커스텀 조합 패널 펼치기' : '필터 및 커스텀 조합 패널 접기');
  }

  function toggleAddPanel() {
    setAddPanelCollapsed(!isAddPanelCollapsed);
    localStorage.setItem(ADD_PANEL_COLLAPSE_KEY, String(isAddPanelCollapsed));
  }

  function setPanelMode(mode) {
    if (mode !== 'combo' && mode !== 'filter') {
      addPanelMode = 'filter';
    } else {
      addPanelMode = mode;
    }

    document.getElementById('panel-view-filter').classList.toggle('active', addPanelMode === 'filter');
    document.getElementById('panel-view-combo').classList.toggle('active', addPanelMode === 'combo');

    document.getElementById('mode-btn-filter').classList.toggle('active', addPanelMode === 'filter');
    document.getElementById('mode-btn-combo').classList.toggle('active', addPanelMode === 'combo');
    localStorage.setItem(ADD_PANEL_MODE_KEY, addPanelMode);
  }

  function openAddPromptModal() {
    const modal = document.getElementById('add-prompt-modal');
    const mainSelect = document.getElementById('input-main-category');
    const subSelect = document.getElementById('input-sub-category');

    isAddPromptModalOpen = true;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';

    renderCategorySelectors();

    const targetMain = activeCategoryPrompt || lastAddMainCategory;
    if (targetMain && [...getMainCategories(), '__new__'].includes(targetMain)) {
      mainSelect.value = targetMain;
    }

    renderSubCategorySelect();

    const targetSub = activeSubCategoryPrompt || lastAddSubCategory;
    if (targetSub && [...getSubCategories(mainSelect.value), '기타'].includes(targetSub)) {
      subSelect.value = targetSub;
    }

    syncAddFormSelection();
    document.getElementById('input-content').focus();
  }

    lastAddMainCategory = select.value;
    lastAddSubCategory = '';
  function closeAddPromptModal() {
    const modal = document.getElementById('add-prompt-modal');
    isAddPromptModalOpen = false;
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }

  function handleAddPromptModalBackdrop(e) {
    if (e.target && e.target.id === 'add-prompt-modal') {
      closeAddPromptModal();
    }
    lastAddSubCategory = select.value;
  }

  function selectCategory(value) {
    const select = document.getElementById('input-main-category');
    select.value = value;
    activeCategoryPrompt = value;
    activeSubCategoryPrompt = null;
    renderSubCategorySelect();
  }

  function selectSubCategory(value) {
    const select = document.getElementById('input-sub-category');
    select.value = value;
    activeSubCategoryPrompt = value;
  }

  // ── Actions ──
  function addPrompt() {
    const mainSelect = document.getElementById('input-main-category');
    const subSelect = document.getElementById('input-sub-category');
    const mainCategory = mainSelect.value.trim();
    const subCategory = subSelect.value.trim();
    const contentInput = document.getElementById('input-content');
    const content = contentInput.value.trim();
    if (!mainCategory) { showToast('대분류를 입력하세요'); return; }
    if (!subCategory) { showToast('중분류를 입력하세요'); return; }
    if (!content) { showToast('프롬프트 내용을 입력하세요'); return; }

    lastAddMainCategory = mainCategory;
    lastAddSubCategory = subCategory;
    activeCategoryPrompt = mainCategory;
    activeSubCategoryPrompt = subCategory;

    prompts.push({ id: uid(), mainCategory, subCategory, content });
    save();
    contentInput.value = '';

    renderCategorySelectors();
    mainSelect.value = mainCategory;
    renderSubCategorySelect();
    subSelect.value = subCategory;

    render();
    closeAddPromptModal();
    showToast('저장되었습니다');
  }

  function deletePrompt(id, source, e) {
    e.stopPropagation();
    if (source === 'prompt' && !confirm('정말 삭제하시겠습니까?')) return;
    clearOutputOverride();
    if (source === 'composed') {
      composedPrompts = composedPrompts.filter(p => p.id !== id);
    } else {
      prompts = prompts.filter(p => p.id !== id);
    }
    selected = selected.filter(s => !(s.id === id && s.source === source));
    save();
    render();
  }

  function toggleSelect(p, source) {
    clearOutputOverride();
    const idx = selected.findIndex(s => s.id === p.id && s.source === source);
    if (idx >= 0) {
      selected.splice(idx, 1);
    } else {
      selected.push({ ...p, source });
    }
    render();
  }

  function removeSelected(i) {
    clearOutputOverride();
    selected.splice(i, 1);
    render();
  }

  function clearSelected() {
    clearOutputOverride();
    selected = [];
    render();
  }

  function clearCurrentComposition() {
    if (!confirm('현재 조합된 프롬프트를 모두 초기화하시겠습니까?')) return;
    clearOutputOverride();
    selected = [];
    render();
    showToast('현재 조합이 초기화되었습니다');
  }

  function copyPrompt() {
    const text = isOutputEditing ? document.getElementById('output-editor').value : getComposedOutputText();
    if (!text.trim()) { showToast('복사할 프롬프트가 없습니다'); return; }
    navigator.clipboard.writeText(text).then(() => showToast('클립보드에 복사되었습니다!')).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('클립보드에 복사되었습니다!');
    });
  }

  function copyPromptSilently(text) {
    if (!text.trim()) return Promise.resolve(false);
    return navigator.clipboard.writeText(text).then(() => true).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    });
  }

  function saveComposedPrompt() {
    const mainCategoryInput = document.getElementById('combo-main-category');
    const subCategoryInput = document.getElementById('combo-sub-category');
    const mainCategory = mainCategoryInput.value.trim();
    const subCategory = subCategoryInput.value.trim();
    const items = selected.map(normalizeSelected).filter(item => item && item.content).map(cleanPrompt);
    if (!mainCategory) {
      showToast('커스텀 조합 대분류를 입력하세요');
      return;
    }
    if (!subCategory) {
      showToast('커스텀 조합 이름(중분류)을 입력하세요');
      return;
    }
    if (items.length === 0) {
      showToast('저장할 조합이 없습니다');
      return;
    }

    composedPrompts.push({
      id: uid(),
      mainCategory,
      subCategory,
      category: mainCategory,
      items,
      content: items.map(p => p.content).join(', '),
    });
    save();
    render();
    showToast('조합 프롬프트가 저장되었습니다');
  }

  // ── CSV ──
  function exportCSV() {
    if (prompts.length === 0 && composedPrompts.length === 0) { showToast('내보낼 프롬프트가 없습니다'); return; }
    const rows = [['type', 'mainCategory', 'subCategory', 'content']];
    prompts.forEach(p => rows.push(['individual', csvEsc(p.mainCategory), csvEsc(p.subCategory), csvEsc(p.content)]));
    composedPrompts.forEach(p => rows.push(['composed', csvEsc(p.mainCategory || p.category || '커스텀 조합'), csvEsc(p.subCategory || '이름없음'), csvEsc(p.content)]));
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'prompts_' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('CSV 내보내기 완료');
  }

  function importCSV(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = ev.target.result.replace(/^\uFEFF/, '');
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      let added = 0;
      lines.forEach((line, i) => {
        if (i === 0 && /^(type,mainCategory,subCategory,content|type,category,content|category,content)/i.test(line.trim())) return; // header
        const parts = parseCSVLine(line);
        if (parts.length >= 4 && parts[1].trim() && parts[2].trim() && parts[3].trim()) {
          const type = parts[0].trim().toLowerCase();
          const item = { id: uid(), mainCategory: parts[1].trim(), subCategory: parts[2].trim(), content: parts[3].trim() };
          if (type === 'composed' || type === 'combo' || type === 'custom') {
            composedPrompts.push(normalizeComposedPrompt({
              id: item.id,
              mainCategory: item.mainCategory,
              subCategory: item.subCategory,
              content: item.content,
            }));
          } else {
            prompts.push(item);
          }
          added++;
          return;
        }

        if (parts.length >= 3 && parts[1].trim() && parts[2].trim()) {
          const type = parts[0].trim().toLowerCase();
          const item = { id: uid(), mainCategory: parts[1].trim(), subCategory: parts[1].trim(), content: parts[2].trim() };
          if (type === 'composed' || type === 'combo' || type === 'custom') {
            composedPrompts.push(normalizeComposedPrompt({
              id: item.id,
              mainCategory: item.mainCategory,
              subCategory: item.subCategory,
              content: item.content,
            }));
          } else {
            prompts.push(item);
          }
          added++;
          return;
        }

        if (parts.length >= 2 && parts[0].trim() && parts[1].trim()) {
          // 이전 CSV 포맷(category,content)은 개별 프롬프트로 가져온다.
          prompts.push({ id: uid(), mainCategory: '기타', subCategory: parts[0].trim(), content: parts[1].trim() });
          added++;
        }
      });
      save();
      render();
      showToast(`${added}개 프롬프트를 가져왔습니다`);
    };
    reader.readAsText(file, 'UTF-8');
    e.target.value = '';
    const addImport = document.getElementById('csv-import');
    const comboImport = document.getElementById('csv-import-combo');
    if (addImport) addImport.value = '';
    if (comboImport) comboImport.value = '';
  }

  function parseCSVLine(line) {
    const result = [];
    let cur = '';
    let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ) {
        result.push(cur); cur = '';
      } else {
        cur += c;
      }
    }
    result.push(cur);
    return result;
  }

  function csvEsc(s) {
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  // ── Drag to reorder ──
  let dragIdx = null;

  function dragStart(e) {
    dragIdx = +e.currentTarget.dataset.idx;
    e.dataTransfer.effectAllowed = 'move';
  }

  function dragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }

  function drop(e) {
    e.preventDefault();
    const toIdx = +e.currentTarget.dataset.idx;
    if (dragIdx === null || dragIdx === toIdx) return;
    clearOutputOverride();
    const item = selected.splice(dragIdx, 1)[0];
    selected.splice(toIdx, 0, item);
    dragIdx = null;
    render();
  }

  // ── Toast ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ── Escape HTML ──
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Keyboard shortcut: Enter in textarea ──
  document.getElementById('input-content').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) addPrompt();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && isAddPromptModalOpen) {
      closeAddPromptModal();
    }
  });

  // ── Category selectors ──
  const categoryInput = document.getElementById('input-main-category');
  const subCategoryInput = document.getElementById('input-sub-category');
  const comboMainCategoryInput = document.getElementById('combo-main-category');
  const comboSubCategoryInput = document.getElementById('combo-sub-category');

  categoryInput.addEventListener('change', handleMainCategoryChange);
  subCategoryInput.addEventListener('change', handleSubCategoryChange);
  comboMainCategoryInput.addEventListener('change', handleComposedMainCategoryChange);
  comboSubCategoryInput.addEventListener('change', handleComposedSubCategoryChange);

  // ── Init ──
  setAddPanelCollapsed(localStorage.getItem(ADD_PANEL_COLLAPSE_KEY) === 'true');
  setPanelMode(localStorage.getItem(ADD_PANEL_MODE_KEY) || 'filter');
  load();
  render();
</script>
</body>
</html>
